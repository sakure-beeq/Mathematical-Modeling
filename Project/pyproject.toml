[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mmer-preprocess"
version = "0.1.0"
description = "Preprocessing pipeline for the multimodal emotion recognition modeling problem"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
bert = ["torch>=2.1", "transformers>=4.38"]

[project.scripts]
mmer-preprocess = "mmer_preprocess.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

